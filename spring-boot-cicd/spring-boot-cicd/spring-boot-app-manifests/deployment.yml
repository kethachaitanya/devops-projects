apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app
  namespace: spring-boot
  labels:
    app: spring-boot-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      labels:
        app: spring-boot-app
    spec:
      containers:
        - name: spring-boot-app
          image: YOUR_DOCKERHUB_USER/ultimate-cicd:replaceImageTag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # CHALLENGE 05:
          # This app does not expose /healthz, so rollout verification will fail.
          # Fix both probes to use path: / after you reach the deployment stage.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 3
